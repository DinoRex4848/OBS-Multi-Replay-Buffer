name: Native builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag against CMake
        run: python3 scripts/release-assets.py check --ref "$GITHUB_REF"
      - name: Test release gates without publishing
        run: python3 tests/release_assets_tests.py
  fedora:
    needs: version
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git gcc-c++ cmake ninja-build obs-studio-devel qt6-qtbase-devel ffmpeg-free-devel python3
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREPLAY_INTEGRATION_TEST=OFF
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          python3 tests/flatpak_installer_tests.py
          python3 scripts/package-fedora.py
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-x86_64
          path: dist/*.tar.gz
  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Test portable installer with Windows PowerShell
        shell: powershell
        run: ./tests/windows_installer_tests.ps1
      - name: Install verified Inno Setup compiler
        shell: powershell
        run: ./scripts/install-inno-ci.ps1
      - name: Build Windows SDK, plugin and helper
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test compiled Windows setup
        shell: powershell
        run: ./tests/windows_setup_tests.ps1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-setup-diagnostics
          path: build-windows-setup-logs/*
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
            dist/windows-installer-notices.txt
  linux-installer:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak python3-venv libpython3.10 binutils xvfb openbox libegl1 libgl1 libopengl0 libfontconfig1 libglib2.0-0 libdbus-1-3 libx11-xcb1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0
          python3 -m venv build-installer-venv
          build-installer-venv/bin/pip install -r packaging/linux/requirements.txt
      - name: Install pinned OBS Flatpak and matching SDK
        run: bash scripts/prepare-flatpak-ci.sh
      - name: Build production plugin and installer
        run: |
          bash scripts/build-flatpak.sh
          build-installer-venv/bin/python scripts/package-linux-installer.py
      - name: Test installation transactions and wizard
        run: |
          python3 tests/flatpak_installer_tests.py
          QT_QPA_PLATFORM=offscreen build-installer-venv/bin/python tests/linux_installer_gui_tests.py
          dist/*-linux-flatpak-x86_64-setup.run --verify-payload > build-flatpak/installer-payload.json
          QT_QPA_PLATFORM=offscreen dist/*-linux-flatpak-x86_64-setup.run --smoke-test
          xvfb-run -a dist/*-linux-flatpak-x86_64-setup.run --smoke-test
      - name: Production OBS load smoke with isolated configuration
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python3 tests/create_smoke_template.py build-ci-template
          xvfb-run -a sh -c 'openbox > /tmp/openbox.log 2>&1 & python3 scripts/test-obs-ui.py --build build-flatpak --template build-ci-template --scratch build-ci-obs-smoke --scenario production --flatpak'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer-x86_64
          if-no-files-found: error
          path: |
            dist/*-setup.run
            dist/*-setup.run.sha256
            dist/linux-installer-notices.txt
            dist/linux-build.json
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [fedora, windows, linux-installer]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*x86_64'
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Validate assets and create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release-assets.py draft --ref "$GITHUB_REF"
