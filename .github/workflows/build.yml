name: Native builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag against CMake
        run: python3 scripts/release-assets.py check --ref "$GITHUB_REF"
      - name: Test release gates without publishing
        run: python3 tests/release_assets_tests.py
  fedora:
    needs: version
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git gcc-c++ cmake ninja-build obs-studio-devel qt6-qtbase-devel ffmpeg-free-devel python3 shadow-utils util-linux
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREPLAY_INTEGRATION_TEST=OFF
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          python3 tests/flatpak_installer_tests.py
          useradd --create-home replay-tests
          runuser -u replay-tests -- python3 tests/linux_package_tests.py
          python3 scripts/package-fedora.py
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-x86_64
          path: dist/*.tar.gz
  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Test portable installer with Windows PowerShell
        shell: powershell
        run: ./tests/windows_installer_tests.ps1
      - name: Install pinned setup compiler
        # Inno is a build dependency; the resulting setup runs offline.
        shell: pwsh
        run: |
          $Setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $Compiler = Join-Path $env:RUNNER_TEMP "Inno Setup 6"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $Setup
          if ((Get-FileHash -LiteralPath $Setup -Algorithm SHA256).Hash -ne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") {
            throw "Inno Setup download checksum mismatch"
          }
          $Process = Start-Process -FilePath $Setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $Compiler + '"')) -Wait -PassThru
          if ($Process.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $Compiler "ISCC.exe"))) {
            throw "Inno Setup compiler installation failed: $($Process.ExitCode)"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $Compiler -Encoding utf8
      - name: Build Windows SDK, plugin, helper and offline setup
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test portable package, ordinary setup wizard and isolated OBS startup
        shell: powershell
        run: ./tests/windows_package_tests.ps1 -SmokeObs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-package-diagnostics
          path: build-windows-package-logs/*
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*-windows-x64-setup.exe
            dist/*.sha256
            dist/windows-installer-notices.txt
  linux-installer:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak python3 binutils xvfb openbox libx11-6 libgl1-mesa-dri
      - name: Install pinned OBS Flatpak and matching SDK
        run: bash scripts/prepare-flatpak-ci.sh
      - name: Build production plugin and script archive
        run: bash scripts/build-flatpak.sh
      - name: Test transactions and extracted Linux package
        run: |
          python3 tests/flatpak_installer_tests.py
          python3 tests/linux_package_tests.py
          python3 tests/linux_package_tests.py --production-archive dist/*-linux-flatpak-x86_64.tar.gz
      - name: Production OBS load smoke with isolated configuration
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python3 tests/create_smoke_template.py build-ci-template
          xvfb-run -a sh -c 'openbox > /tmp/openbox.log 2>&1 & python3 scripts/test-obs-ui.py --build build-flatpak --template build-ci-template --scratch build-ci-obs-smoke --scenario production --flatpak'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer-x86_64
          if-no-files-found: error
          path: |
            dist/*-linux-flatpak-x86_64.tar.gz
            dist/*-linux-flatpak-x86_64.tar.gz.sha256
            dist/*-linux-flatpak-x86_64.run
            dist/*-linux-flatpak-x86_64.run.sha256
            dist/linux-installer-notices.txt
            dist/linux-build.json
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [fedora, windows, linux-installer]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*x86_64'
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Validate assets and create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release-assets.py draft --ref "$GITHUB_REF"
